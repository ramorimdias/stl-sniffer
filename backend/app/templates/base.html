<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">STL Sniffer</a>
    <nav>
      <a href="/">Search</a>
      <a class="button small" href="/submit">Submit</a>
    </nav>
  </header>
  <main class="shell">{% block content %}{% endblock %}</main>
  <footer class="footer">Metadata index for 3D-model torrents. STL Sniffer does not host model payloads.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
